; Placa: AI-Thinker ESP32-CAM
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_port = COM3
upload_port = COM3
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800

lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    espressif/esp32-camera

; Tabla custom: app grande + SPIFFS para cola offline local
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue