; Configuración PlatformIO - Proyecto Alarma ESP32-CAM
; Placa: AI-Thinker ESP32-CAM
[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bblanchon/ArduinoJson@^6.21.5

; Habilita el uso de PSRAM (necesario para fotos de buena calidad)
board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue